[package]
name = "audiomockd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "audiomockd"
path = "src/main.rs"

[dependencies]
audiomock-proto = { path = "../audiomock-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
crossbeam-channel = "0.5"
# v0_3_49 exposes pw_buffer::requested, needed to fill exactly the quantum the
# graph asks for rather than the whole mapped buffer.
pipewire = { version = "0.8", features = ["v0_3_49"] }
libspa = "0.8"
gstreamer = "0.23"
gstreamer-audio = "0.23"
gstreamer-app = "0.23"

[dev-dependencies]
tempfile = "3"
